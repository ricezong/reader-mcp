server:
  port: 8081
  # 解决中文参数乱码
  tomcat:
    uri-encoding: UTF-8
    # 多人并发场景下增大线程数（默认 200），SYNC 模式每个请求阻塞一个线程
    threads:
      max: 400
      min-spare: 20
    # 增大连接队列，防止并发请求被拒绝
    max-connections: 10000
    accept-count: 200
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: reader-mcp

  # Spring AI MCP Server 配置（Streamable-HTTP 传输）
  ai:
    mcp:
      server:
        name: reader-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        # 向 AI 客户端描述服务器能力，帮助模型更精准地选择工具
        instructions: "小说/漫画下载器 MCP 服务，支持聚合搜索小说和漫画、按作者查询作品、获取书籍详情、章节目录、单章正文和批量下载章节正文内容。搜索时无需指定书源，引擎自动聚合所有源；搜索结果中包含 source 字段，后续操作（详情/目录/正文/下载）需传入该 source 和 bookUrl。"
        # 批量下载场景需要更长的超时
        request-timeout: 120s
        capabilities:
          tool: true
        streamable-http:
          mcpEndpoint: /mcp

# 下载器配置
reader:
  # 单次搜索结果上限
  max-search-results: 50
  # 单次下载章节数上限（防止滥用）
  max-download-chapters: 200
  # 下载文件配置
  download:
    # 临时文件存放目录（默认为系统临时目录下的 reader-downloads）
    temp-dir: ${java.io.tmpdir}reader-downloads
    # 文件过期时间（小时），过期后自动清理
    expire-hours: 24
    # 服务外部访问基础 URL，用于拼接下载链接
    # 部署到服务器时必须显式配置，如 https://reader.example.com
    # 未配置时使用 http://localhost:8081 兜底
    base-url: ""
